  <text x="345" y="83" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-weight="600" fill="#FFF5EC" letter-spacing="2" style="fill:rgb(255, 245, 236);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Georgia, serif;font-size:12px;font-weight:600;text-anchor:middle;dominant-baseline:auto">SUMMER SALE</text>

