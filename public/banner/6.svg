  <circle cx="590" cy="190" r="48" fill="#C8956C" style="fill:rgb(200, 149, 108);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <circle cx="590" cy="190" r="44" fill="none" stroke="#FFF5EC" stroke-width="1.5" stroke-dasharray="4,3" style="fill:none;stroke:rgb(255, 245, 236);color:rgb(0, 0, 0);stroke-width:1.5px;stroke-dasharray:4px, 3px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <text x="590" y="180" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#FFF5EC" letter-spacing="1" style="fill:rgb(255, 245, 236);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Georgia, serif;font-size:13px;font-weight:400;text-anchor:middle;dominant-baseline:auto">UP TO</text>
  <text x="590" y="205" text-anchor="middle" font-family="Georgia, serif" font-size="28" font-weight="700" fill="#FFF5EC" style="fill:rgb(255, 245, 236);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Georgia, serif;font-size:28px;font-weight:700;text-anchor:middle;dominant-baseline:auto">50%</text>
  <text x="590" y="222" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#FFF5EC" letter-spacing="2" style="fill:rgb(255, 245, 236);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Georgia, serif;font-size:12px;font-weight:400;text-anchor:middle;dominant-baseline:auto">OFF</text>

