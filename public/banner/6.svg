    <polygon points="530,60 533,70 543,70 535,76 538,86 530,80 522,86 525,76 517,70 527,70" transform="scale(0.6) translate(345,42)" style="fill:rgb(200, 149, 108);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
    <polygon points="620,90 622,96 628,96 623,100 625,106 620,102 615,106 617,100 612,96 618,96" transform="scale(0.5) translate(625,98)" style="fill:rgb(200, 149, 108);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
