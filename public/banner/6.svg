  <rect x="280" y="255" width="130" height="38" rx="19" fill="#3D2B1F" style="fill:rgb(61, 43, 31);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <text x="345" y="279" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="600" fill="#F5EFE6" letter-spacing="1.5" style="fill:rgb(245, 239, 230);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Georgia, serif;font-size:13px;font-weight:600;text-anchor:middle;dominant-baseline:auto">EXPLORE →</text>
</svg>